<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Outbreak Protocol</title>
<meta name="description" content="A lightweight pandemic strategy game. Spread your pathogen, sabotage the cure, infect the world.">
<meta name="theme-color" content="#070b12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ff3b4e'/%3E%3C/svg%3E">
<style>:root{
  --bg:#070b12; --panel:#0f1620; --panel2:#151f2c; --line:#243244; --text:#e6edf5; --dim:#8196ad;
  --ocean:#17435f; --land:#6a8a58; --inf:#ff3b4e; --dead:#b08cff; --good:#38d6a0; --warn:#ffb020; --cure:#4cc3ff;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-cb="1"]{ --inf:#ff9d00; --dead:#4f6bff; --good:#00b3a4; --cure:#e5e5e5; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:.5rem .8rem}
button:hover:not(:disabled){border-color:var(--dim)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cure);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* top bar */
#top{display:flex;align-items:center;gap:.6rem;padding:.5rem .75rem;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top h1{font-size:1rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin-right:auto;display:flex;align-items:center;gap:.5rem}
#top h1 i{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:var(--inf);box-shadow:0 0 12px var(--inf)}
.stat{display:flex;flex-direction:column;line-height:1.1;min-width:4.2rem}
.stat small{color:var(--dim);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase}
.stat b{font-size:1.02rem;font-variant-numeric:tabular-nums}
#speed{display:flex;gap:.25rem}
#speed button{padding:.4rem .65rem;min-width:2.4rem;font-weight:700}
#speed button.on{background:var(--cure);color:#05121c;border-color:var(--cure)}
#pts{color:var(--good)}

/* map */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2a6a8c 0,var(--ocean) 75%)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
#news{position:absolute;top:.6rem;left:50%;transform:translateX(-50%);max-width:min(92%,760px);width:max-content;padding:.45rem .9rem;border-radius:999px;background:#0b1320e6;border:1px solid var(--line);font-size:.88rem;pointer-events:none;transition:opacity .4s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#news.sab{border-color:var(--cure)} #news.death{border-color:var(--dead)} #news.detect{border-color:var(--warn)} #news.close{border-color:#ff7a59} #news.cure{border-color:var(--cure)}
#tip{position:absolute;pointer-events:none;z-index:5;background:#0b1320f2;border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;font-size:.8rem;min-width:11rem;display:none}
#tip h3{font-size:.9rem;margin-bottom:.25rem}
#tip div{display:flex;justify-content:space-between;gap:1rem;color:var(--dim)}
#tip div b{color:var(--text);font-variant-numeric:tabular-nums}
#tip .flags{margin-top:.3rem;color:var(--warn);font-size:.74rem}
#legend{position:absolute;left:.6rem;bottom:.6rem;font-size:.7rem;color:var(--dim);background:#0b1320cc;border:1px solid var(--line);border-radius:8px;padding:.4rem .55rem;display:flex;flex-direction:column;gap:.25rem}
#legend .bar{height:.5rem;width:8rem;border-radius:4px;background:linear-gradient(90deg,var(--land),#b0734f,var(--inf))}
#zoomBtns{position:absolute;right:.6rem;bottom:.6rem;display:flex;flex-direction:column;gap:.3rem}
#zoomBtns button{width:2.2rem;height:2.2rem;padding:0;font-size:1.1rem}

/* bottom bar */
#bottom{display:grid;grid-template-columns:1fr auto 1fr;gap:.75rem;align-items:center;padding:.6rem .75rem;background:var(--panel);border-top:1px solid var(--line)}
#bottom .left,#bottom .right{display:flex;gap:.5rem;align-items:center}
#bottom .right{justify-content:flex-end}
#counts{display:flex;gap:1.4rem;justify-content:center}
#counts .stat b{font-size:1.15rem}
#cInf b{color:var(--inf)} #cDead b{color:var(--dead)} #cHealthy b{color:var(--good)}
#cureWrap{display:flex;flex-direction:column;gap:.25rem;flex:1;min-width:8rem;max-width:18rem}
#cureWrap small{color:var(--dim);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
.bar2{height:.6rem;background:#0a111a;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2a7fb0,var(--cure));transition:width .3s}
#sab{background:#12304a;border-color:#2b6a98;font-weight:700;position:relative;overflow:hidden;white-space:nowrap}
#sab .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--cure);width:0}
#evoBtn{background:#3a1220;border-color:#8a2a45;font-weight:700}
#evoBtn.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ff3b4e33}}

/* evolve drawer */
#drawer{position:absolute;left:0;right:0;bottom:0;max-height:62%;background:var(--panel);border-top:2px solid var(--line);transform:translateY(102%);visibility:hidden;pointer-events:none;transition:transform .25s,visibility 0s .25s;z-index:8;display:flex;flex-direction:column}
#drawer.open{transform:none;visibility:visible;pointer-events:auto;transition:transform .25s,visibility 0s}
#drawer header{display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;border-bottom:1px solid var(--line)}
#drawer header .tabs{display:flex;gap:.3rem;margin-right:auto}
#drawer header .tabs button.on{background:var(--inf);border-color:var(--inf);color:#14040a;font-weight:700}
#cards{overflow:auto;padding:.7rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.65rem .75rem;display:flex;flex-direction:column;gap:.3rem;text-align:left}
.card h4{font-size:.92rem;display:flex;justify-content:space-between;gap:.5rem}
.card p{font-size:.78rem;color:var(--dim);line-height:1.35}
.card .cost{color:var(--good);font-variant-numeric:tabular-nums}
.card.owned{border-color:var(--good);opacity:.8}
.card.locked{opacity:.45}
.card:not(.owned):not(.locked):hover{border-color:var(--inf)}
.card .req{font-size:.7rem;color:var(--warn)}

/* overlays */
.overlay{position:absolute;inset:0;z-index:20;background:#05080ddd;display:flex;align-items:flex-start;justify-content:center;padding:1rem;overflow:auto;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.4rem;max-width:520px;width:100%;display:flex;flex-direction:column;gap:.9rem;margin:auto}
.modal h2{font-size:1.5rem;letter-spacing:.06em}
.modal p{color:var(--dim);font-size:.9rem;line-height:1.5}
.modal label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;flex-direction:column;gap:.3rem}
.modal input,.modal select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:.55rem .65rem;font:inherit}
.modal .row{display:flex;gap:.6rem;flex-wrap:wrap}
.modal .row>*{flex:1}
.primary{background:var(--inf);border-color:var(--inf);color:#16040a;font-weight:800;padding:.7rem 1rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.stats .stat{background:var(--panel2);border-radius:8px;padding:.5rem .6rem}
.hidden{display:none!important}
footer.credit{font-size:.66rem;color:var(--dim);text-align:center;line-height:1.4}

@media (max-width:720px){
  #top{gap:.4rem} #top h1{width:100%;font-size:.85rem}
  #bottom{grid-template-columns:1fr;gap:.5rem}
  #counts{gap:1rem} #bottom .left,#bottom .right{justify-content:center}
  .stat{min-width:3.6rem}
  #news{font-size:.78rem}
  #legend{display:none}
  #speed button,#trophyBtn,#sndBtn,#menuBtn{padding:.4rem .4rem;min-width:0}
  #speed button{min-width:2rem}
  #speed{gap:.25rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* sound button */
#sndBtn{padding:.4rem .6rem}
/* upgrade cards */
.card .tags{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.1rem}
.card .tags span{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:.05rem .4rem}
.card.poor .cost{color:var(--warn)}
.card.poor{opacity:.75}
/* breaking news */
.brkWrap{z-index:40;background:#02050bee}
.modal.brk{max-width:640px;border:2px solid var(--inf);box-shadow:0 0 0 4px #ff3b4e22,0 20px 60px #000a;padding:0;overflow:hidden;gap:0;animation:brkIn .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes brkIn{from{transform:scale(.85) translateY(20px);opacity:0}}
.brkBar{display:flex;align-items:center;gap:.7rem;background:var(--inf);color:#14040a;padding:.5rem .75rem;font-weight:900;letter-spacing:.14em}
.brkBar .live{font-size:.7rem;background:#14040a;color:var(--inf);padding:.12rem .45rem;border-radius:4px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.brkBar .tag{margin-right:auto;font-size:1.05rem}
.brkX{background:#14040a;color:#fff;border-color:#14040a;width:2.2rem;height:2.2rem;padding:0;font-size:1.1rem;line-height:1}
.brkX:hover:not(:disabled){background:#fff;color:#14040a;border-color:#fff}
.modal.brk h2{font-size:1.6rem;line-height:1.2;padding:1.1rem 1.1rem .5rem;letter-spacing:.01em}
.modal.brk p{padding:0 1.1rem 1rem;font-size:1rem;color:var(--text);opacity:.85}
.brkTicker{background:#070b12;border-top:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:.4rem 0;font-size:.78rem;color:var(--dim)}
.brkMarq{display:inline-block;padding-left:100%;animation:marq 24s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
.modal.brk small{display:block;text-align:center;color:var(--dim);padding:.5rem;font-size:.72rem;letter-spacing:.06em}
input[type=range]{padding:0;accent-color:var(--cure)}

/* trophies, ratings, toast */
#trophyBtn{padding:.4rem .6rem}
.trophyWrap{z-index:30;align-items:flex-start}
.modal.tr{max-width:860px;margin:auto}
.modal.tr header{display:flex;align-items:center;gap:.6rem}
.modal.tr header h2{margin-right:auto}
.modal.tr h3{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:.4rem}
.modal.tr h3 small{margin-left:.4rem;color:var(--good)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:.5rem}
.rchip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.55rem .6rem;display:flex;flex-direction:column;gap:.15rem;opacity:.55}
.rchip.got{opacity:1;border-color:var(--inf)}
.rchip .ri{font-size:1.3rem}.rchip b{font-size:.85rem}.rchip small{color:var(--dim);font-size:.68rem}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.5rem}
.tcard{display:flex;gap:.6rem;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.55rem .65rem;opacity:.6}
.tcard.got{opacity:1;border-color:#ffc933;background:linear-gradient(135deg,#2a2210,var(--panel2))}
.tcard .ticon{font-size:1.5rem;line-height:1.1}
.tcard b{font-size:.88rem}.tcard p{font-size:.76rem;color:var(--dim);line-height:1.3;margin:.1rem 0 0}.tcard small{font-size:.66rem;color:#ffc933}
.modal.tr details{border:1px solid var(--line);border-radius:10px;padding:.6rem .75rem}
.modal.tr summary{cursor:pointer;font-size:.85rem}
.modal.tr textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:.5rem;font:12px ui-monospace,monospace;margin:.5rem 0;resize:vertical}
.recent{font-size:.8rem;color:var(--dim);display:flex;flex-direction:column;gap:.2rem}
.rate{display:flex;gap:.8rem;align-items:center;background:var(--panel2);border:1px solid var(--inf);border-radius:12px;padding:.7rem .85rem}
.rate .ricon{font-size:2.2rem}.rate small{display:block;color:var(--dim);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}
.rate b{font-size:1.2rem}.rate span.bl{display:block;color:var(--dim);font-size:.8rem}
.rate .nb{margin-left:auto;background:#ffc933;color:#201600;font-weight:800;font-size:.68rem;letter-spacing:.08em;padding:.2rem .5rem;border-radius:6px;white-space:nowrap}
.newTroph{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.newTroph small{width:100%;color:var(--dim);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}
.newTroph span{background:#2a2210;border:1px solid #ffc933;border-radius:999px;padding:.2rem .6rem;font-size:.8rem}
#toast{position:absolute;top:3.6rem;right:.7rem;z-index:35;max-width:min(92%,340px);background:#1b1608f2;border:1px solid #ffc933;border-radius:12px;padding:.6rem .8rem;display:flex;flex-direction:column;gap:.1rem;transform:translateX(120%);transition:transform .35s cubic-bezier(.2,1.2,.4,1);pointer-events:none}
#toast.show{transform:none}
#toast b{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#ffc933}
#toast span{font-size:1rem;font-weight:700}#toast small{color:var(--dim);font-size:.76rem}

/* start screen: How to play box, collapsible settings */
.modal.start{position:relative}
.linkBtn{background:none;border:none;color:var(--cure);text-decoration:underline;padding:0;font-size:.85rem;letter-spacing:.08em;text-align:left;width:fit-content}
.linkBtn:hover:not(:disabled){border:none;color:var(--text)}
.howBox{position:absolute;top:3.4rem;left:1rem;right:1rem;z-index:5;background:var(--bg);border:1px solid #444;border-radius:10px;padding:1rem;box-shadow:0 8px 24px #000c;max-height:85%;overflow-y:auto}
.howHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.howX{background:none;border:none;font-size:1.2rem;padding:.2rem .4rem;line-height:1}
.howBox p{font-size:.9rem;line-height:1.45;color:var(--text)}
.setBox{border:1px solid var(--line);border-radius:10px;padding:.55rem .75rem}
.setBox summary{cursor:pointer;font-size:.85rem;color:var(--dim)}
.setBox[open] summary{margin-bottom:.7rem}
.setBox .row{margin-top:.5rem}
@media (max-width:720px){
  /* while the start screen is up on a phone, give it the whole screen: hide the game controls behind it */
  #app.onstart #bottom{display:none}
  #app.onstart #top>*:not(h1){display:none}
  .overlay{padding:.6rem}
  .modal{padding:1rem;gap:.7rem}
  .modal h2{font-size:1.25rem}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1><i></i>Outbreak Protocol</h1>
    <div class="stat"><small>Day</small><b id="day">0</b></div>
    <div class="stat"><small>DNA</small><b id="pts">0</b></div>
    <div id="speed" role="group" aria-label="Game speed">
      <button data-s="0" title="Pause (Space)" aria-label="Pause">&#10074;&#10074;</button>
      <button data-s="1" class="on" title="1x (1)">1x</button>
      <button data-s="2" title="2x (2)">2x</button>
      <button data-s="3" title="3x (3)">3x</button>
    </div>
    <button id="trophyBtn" title="Trophy Room" aria-label="Trophy Room">&#127942;</button>
    <button id="sndBtn" title="Sound (M)" aria-label="Mute">&#128266;</button>
    <button id="menuBtn" title="Menu" aria-label="Menu">&#9776;</button>
  </div>
  <div id="stage">
    <canvas id="map" aria-label="World map"></canvas>
    <div id="news" style="opacity:0"></div>
    <div id="tip"></div>
    <div id="legend"><span>Infection rate</span><div class="bar"></div><span>Click green DNA bubbles to collect</span></div>
    <div id="zoomBtns"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit" aria-label="Reset view">&#8962;</button></div>
    <div id="drawer" aria-label="Evolve">
      <header>
        <div class="tabs" id="tabs"></div>
        <span><span style="color:var(--dim);font-size:.75rem">DNA</span> <b id="dPts" style="color:var(--good)">0</b></span>
        <button id="drawerClose" aria-label="Close">&times;</button>
      </header>
      <div id="cards"></div>
    </div>
    <div id="startOv" class="overlay hidden"></div>
    <div id="endOv" class="overlay hidden"></div>
    <div id="menuOv" class="overlay hidden"></div>
    <div id="trophyOv" class="overlay trophyWrap hidden"></div>
    <div id="brkOv" class="overlay brkWrap hidden"></div>
    <div id="toast" aria-live="polite"></div>
  </div>
  <div id="bottom">
    <div class="left">
      <button id="evoBtn" title="Evolve (E)">&#129516; Evolve</button>
      <button id="sab" title="Sabotage the cure (S)"><span id="sabTxt">Sabotage cure</span><span class="cd" id="sabCd"></span></button>
    </div>
    <div id="counts">
      <div class="stat" id="cInf"><small>Infected</small><b>0</b></div>
      <div class="stat" id="cDead"><small>Dead</small><b>0</b></div>
      <div class="stat" id="cHealthy"><small>Healthy</small><b>0</b></div>
    </div>
    <div class="right">
      <div id="cureWrap"><small><span>Cure</span><span id="cureTxt">0%</span></small><div class="bar2"><i id="cureBar"></i></div></div>
    </div>
  </div>
</div>
<!-- Optional asset files: sound manifest, extra headlines, real country borders (tools/build_map.py). Missing files are fine. -->
<script src="assets/audio/manifest.js"></script>
<script src="assets/content/extra.js"></script>
<script src="assets/map/world.js"></script>

  function doSabotage() { if (st && sabotage(st)) { Sound.play('sabotage'); hud(); } else if (st && !st.over) Sound.play('deny'); }
  $('sab').addEventListener('click', doSabotage);

  // ---------- tooltip + map input ----------
  function showTip(i) {
    const r = REGIONS[i], tip = $('tip'); if (!st) return;
    const flags = [];
    if (st.aware[i] >= 0) flags.push('Disease detected'); if (st.cb[i]) flags.push('Borders closed');
    if (st.ca[i]) flags.push('Airports closed'); if (st.cs[i]) flags.push('Ports closed'); if (st.lock[i]) flags.push('Lockdown');
    const cm = climateMult(st, i), cmTxt = r.climate === 'temperate' ? 'temperate' : r.climate + ' · spread ×' + cm.toFixed(2) + (cm < 0.99 ? ' (' + r.climate + ' resistance helps)' : '');
    tip.innerHTML = '<h3>' + esc(r.name) + '</h3><div>Population <b>' + fmt(r.pop * 1e6) + '</b></div><div>Infected <b style="color:var(--inf)">' + fmt(st.I[i]) + '</b></div><div>Dead <b style="color:var(--dead)">' + fmt(st.D[i]) + '</b></div><div>Healthy <b style="color:var(--good)">' + fmt(Math.max(0, st.S[i])) + '</b></div><div>Climate <b>' + esc(cmTxt) + '</b></div>' + (flags.length ? '<div class="flags">' + flags.join(' · ') + '</div>' : '');
    tip.style.display = 'block';
    const [sx, sy] = MapView.toScreen(r.c[0], r.c[1]), [cw, ch] = MapView.size;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(6, Math.min(cw - w - 6, sx + 14)) + 'px';
    tip.style.top = Math.max(50, Math.min(ch - h - 6, sy - h / 2)) + 'px';
  }
  function hideTip() { $('tip').style.display = 'none'; }
  function collect(id, sx, sy) {
    const b = st.bubbles.find(x => x.id === id); if (!b) return;
    const v = collectBubble(st, id);
    if (v) { MapView.addPop('+' + v + ' DNA', sx, sy, b.gold ? '#ffc933' : undefined); Sound.play(b.gold ? 'gold' : 'dna'); hud(); }
  }
  const cv = $('map'); const ptrs = new Map(); let dragMoved = 0, pinch0 = 0;
  const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => {
    const p = local(e);
    if (st && !st.over && !blocked()) { const id = MapView.hitBubble(p[0], p[1], st); if (id) { collect(id, p[0], p[1]); return; } }
    cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, p); dragMoved = 0;
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); }
  });
  cv.addEventListener('pointermove', e => {
    const p = local(e), prev = ptrs.get(e.pointerId);
    if (prev) {
      if (ptrs.size === 1) { dragMoved += Math.abs(p[0] - prev[0]) + Math.abs(p[1] - prev[1]); if (dragMoved > 6) { MapView.pan(p[0] - prev[0], p[1] - prev[1]); cv.classList.add('drag'); } }
      else if (ptrs.size === 2) { ptrs.set(e.pointerId, p); const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch0) MapView.zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, d / pinch0); pinch0 = d; dragMoved = 99; return; }
      ptrs.set(e.pointerId, p);
    } else if (e.pointerType === 'mouse') {
      const h = MapView.hitTest(p[0], p[1]); MapView.setHover(h);
      cv.style.cursor = st && MapView.hitBubble(p[0], p[1], st) ? 'pointer' : '';
      if (MapView.selected < 0) { if (h >= 0) showTip(h); else hideTip(); }
    }
  });
  const endPtr = e => { ptrs.delete(e.pointerId); cv.classList.remove('drag'); pinch0 = 0; };
  cv.addEventListener('pointerup', e => {
    const wasClick = dragMoved <= 6 && ptrs.size === 1; endPtr(e);
    if (wasClick) {
      const [x, y] = local(e), h = MapView.hitTest(x, y);
      if (h === MapView.selected || h < 0) { MapView.setSelected(-1); hideTip(); } else { MapView.setSelected(h); showTip(h); }
    }
  });
  cv.addEventListener('pointercancel', endPtr);
  cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { MapView.setHover(-1); if (MapView.selected < 0) hideTip(); } });
  cv.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = local(e); MapView.zoomAt(x, y, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  $('zin').addEventListener('click', () => { const [w, h] = MapView.size; MapView.zoomAt(w / 2, h / 2, 1.5); });
  $('zout').addEventListener('click', () => { const [w, h] = MapView.size; MapView.zoomAt(w / 2, h / 2, 1 / 1.5); });
  $('zfit').addEventListener('click', () => MapView.fit());
  window.addEventListener('resize', () => { MapView.resize(); });

  window.addEventListener('keydown', e => {
    if (trOpen()) { if (e.key === 'Escape') { e.preventDefault(); closeTrophies(); } return; }
    const how = $('howToPlayText'); if (how && !how.classList.contains('hidden')) { if (e.key === 'Escape') { e.preventDefault(); $('closeHowToPlay').click(); } return; }
    if (brkOpen()) { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); closeBreak(); } return; }
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey) return;
    if (e.key === ' ') { e.preventDefault(); setSpeed(userPaused ? 1 : 0); }
    else if (e.key === '1' || e.key === '2' || e.key === '3') setSpeed(+e.key);
    else if (e.key === 'e' || e.key === 'E') toggleDrawer();
    else if (e.key === 's' || e.key === 'S') doSabotage();
    else if (e.key === 'm' || e.key === 'M') { Sound.setMuted(!Sound.muted); updSndBtn(); }
    else if (e.key === 'Escape') { toggleDrawer(false); MapView.setSelected(-1); hideTip(); }
  });

  // ---------- screens ----------
  const regionOptions = () => REGIONS.slice().sort((a, b) => a.name.localeCompare(b.name)).map(r => '<option value="' + r.id + '">' + esc(r.name) + ' (' + r.climate + ')</option>').join('');
  function settingsHTML() {
    return '<div class="row"><button id="sSnd">Sound: ' + (Sound.muted ? 'off' : 'on') + '</button><button id="sCb">Colorblind palette: ' + (document.documentElement.dataset.cb === '1' ? 'on' : 'off') + '</button></div>' +
      '<div class="row"><label>Volume<input id="sVol" type="range" min="0" max="100" value="' + Math.round(Sound.volume * 100) + '"></label>' +
      '<label>Breaking news<select id="sBrk"><option value="all">All interrupts</option><option value="miles">Milestones only</option><option value="off">Off (ticker only)</option></select></label></div>';
  }
  function wireSettings(root) {
    const q = id => root.querySelector('#' + id);
    q('sSnd').onclick = () => { Sound.unlock(); Sound.setMuted(!Sound.muted); q('sSnd').textContent = 'Sound: ' + (Sound.muted ? 'off' : 'on'); updSndBtn(); };
    q('sCb').onclick = () => toggleCb(q('sCb'));
    q('sVol').oninput = e => Sound.setVolume(e.target.value / 100);
    q('sBrk').value = brkMode; q('sBrk').onchange = e => { brkMode = e.target.value; store.set(BRK_KEY, brkMode); };
  }
  function showStart() {
    const saved = load();
    const ov = $('startOv'); ov.classList.remove('hidden'); $('app').classList.add('onstart');
    ov.innerHTML = '<div class="modal start"><h2>OUTBREAK PROTOCOL</h2>' +
      '<button id="howToPlayBtn" class="linkBtn" aria-expanded="false" aria-controls="howToPlayText">HOW TO PLAY</button>' +
      '<div id="howToPlayText" class="howBox hidden" role="dialog" aria-label="How to play">' +
        '<div class="howHead"><strong>How to Play</strong><button id="closeHowToPlay" class="howX" aria-label="Close how to play">&#10005;</button></div>' +
        '<p>Name your pathogen and pick where it begins. Click the DNA bubbles that pop up on infected regions, then evolve to spread, hide or kill. Sabotage the cure before humanity finishes it. Infect everyone to win. If the cure reaches 100%, you lose. Climate matters: a cold start needs cold resistance, a hot one needs heat resistance.</p>' +
      '</div>' +
      '<div class="row"><label>Pathogen name<input id="pName" maxlength="24" value="Nightfall"></label>' +
      '<label>Patient zero<select id="pStart"><option value="">Random</option>' + regionOptions() + '</select></label></div>' +
      '<label>Seed (optional, same seed = same game)<input id="pSeed" inputmode="numeric" placeholder="e.g. 2027"></label>' +
      '<div class="row"><button class="primary" id="goBtn">Start outbreak</button><button id="dailyBtn">Daily challenge</button></div>' +
      (saved ? '<button id="contBtn">Continue saved game · day ' + saved.day + '</button>' : '') +
      '<button id="trBtn"></button>' +
      (prof.games ? '<p>' + prof.games + ' game' + (prof.games === 1 ? '' : 's') + ' played · ' + prof.wins + ' won' + (prof.fastestWin ? ' · fastest win ' + prof.fastestWin + ' days' : '') + (prof.bestRating >= 0 ? ' · best rating: ' + esc(RATINGS[prof.bestRating].name) : '') + '</p>' : '') +
      '<details class="setBox"><summary>Settings</summary>' + settingsHTML() + '</details>' +
      '<footer class="credit">Fictional pathogen, simplified world model. Country figures are rounded approximations. Headlines are satire of systems and habits, not of real people.</footer></div>';
    wireSettings(ov); refreshTrBtn();
    const setHow = show => {
      $('howToPlayText').classList.toggle('hidden', !show);
      $('howToPlayBtn').setAttribute('aria-expanded', show ? 'true' : 'false');
      if (show) { ov.scrollTop = 0; $('closeHowToPlay').focus(); } else $('howToPlayBtn').focus();
    };
    $('howToPlayBtn').onclick = () => setHow($('howToPlayText').classList.contains('hidden'));
    $('closeHowToPlay').onclick = () => setHow(false);
    $('trBtn').onclick = showTrophies;
    $('goBtn').onclick = () => {
      const s = $('pSeed').value.trim(), seed = s ? (parseInt(s, 10) || hashStr(s)) : (Math.random() * 2 ** 31) | 0;
      begin($('pStart').value || REGIONS[Math.floor(Math.random() * REGIONS.length)].id, seed, $('pName').value);
    };
    $('dailyBtn').onclick = () => {
      const d = new Date(), seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
      begin(REGIONS[seed % REGIONS.length].id, seed, $('pName').value, true);
    };
    if (saved) $('contBtn').onclick = () => { st = saved; resume(false); };
  }
  function hashStr(s) { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return h; }
  function toggleCb(btn) {
    const on = document.documentElement.dataset.cb !== '1';
    document.documentElement.dataset.cb = on ? '1' : '0'; store.set(CB_KEY, on ? '1' : '0'); MapView.refreshPalette();
    if (btn) btn.textContent = 'Colorblind palette: ' + (on ? 'on' : 'off');
  }
  function begin(startId, seed, name, daily) {
    st = newGame(startId, seed, (name || 'Pathogen').trim().slice(0, 24) || 'Pathogen');
    if (daily) st.daily = true;
    store.del(SAVE_KEY); resume(true);
  }
  function resume(fresh) {
    $('startOv').classList.add('hidden'); $('startOv').innerHTML = ''; $('app').classList.remove('onstart'); $('endOv').classList.add('hidden'); $('menuOv').classList.add('hidden'); $('brkOv').classList.add('hidden');
    acc = 0; last = performance.now(); lastSave = st.day; newsShown = fresh ? 0 : st.news.length; bubbleHinted = !fresh;
    MapView.setSelected(-1); hideTip(); setSpeed(1); toggleDrawer(false); hud();
    if (fresh) MapView.fit();
    if (st.brk) openBreak();
  }
  function finish() {
    store.del(SAVE_KEY);
    const t = totals(st), won = st.over === 'win', ri = ratingIndex(st), R = RATINGS[ri];
    // Update the saved profile: counts, rating history, records, recent runs, then trophies.
    prof.games++; if (won) prof.wins++;
    prof.ratings[R.id] = (prof.ratings[R.id] || 0) + 1;
    const newBest = ri > prof.bestRating; if (newBest) prof.bestRating = ri;
    const newRecord = won && (!prof.fastestWin || st.day < prof.fastestWin); if (newRecord) prof.fastestWin = st.day;
    prof.recent.unshift({ t: Date.now(), r: ri, o: st.over, day: st.day, dead: +(t.D / t.pop).toFixed(4), name: st.name }); prof.recent = prof.recent.slice(0, 10);
    const fresh = unlockNew('end'); saveProfile();
    Sound.play(won ? 'win' : 'lose'); if (fresh.length) setTimeout(() => Sound.play('trophy'), 1100);
    const title = won ? 'HUMANITY ENDED' : st.over === 'burnout' ? 'PATHOGEN BURNED OUT' : 'CURE DEPLOYED';
    const msg = won ? esc(st.name) + ' reached every living person.' : st.over === 'burnout' ? 'Not enough hosts remained to keep ' + esc(st.name) + ' alive.' : 'Humanity developed a cure for ' + esc(st.name) + '.';
    const ov = $('endOv'); ov.classList.remove('hidden');
    ov.innerHTML = '<div class="modal"><h2 style="color:' + (won ? 'var(--inf)' : 'var(--cure)') + '">' + title + '</h2><p>' + msg + '</p>' +
      '<div class="rate"><span class="ricon">' + R.icon + '</span><div><small>Pandemic rating</small><b>' + esc(R.name) + '</b><span class="bl">' + esc(R.blurb) + '</span></div>' + (newBest ? '<span class="nb">NEW BEST</span>' : '') + '</div>' +
      '<div class="stats"><div class="stat"><small>Days</small><b>' + st.day + (newRecord ? ' · fastest win!' : '') + '</b></div>' +
      '<div class="stat"><small>Dead</small><b>' + fmt(t.D) + ' (' + (t.D / t.pop * 100).toFixed(1) + '%)</b></div><div class="stat"><small>Regions infected</small><b>' + t.regions + ' / ' + REGIONS.length + '</b></div>' +
      '<div class="stat"><small>Cure progress</small><b>' + st.cure.toFixed(0) + '%</b></div><div class="stat"><small>Sabotages</small><b>' + st.sabCount + '</b></div>' +
      '<div class="stat"><small>DNA bubbles caught</small><b>' + st.bubGot + ' / ' + st.bubMade + '</b></div><div class="stat"><small>Breaking news seen</small><b>' + (st.brkSeen || 0) + '</b></div>' +
      '<div class="stat"><small>Trophies</small><b>' + trophyCount() + ' / ' + TROPHIES.length + '</b></div></div>' +
      (fresh.length ? '<div class="newTroph"><small>New trophies</small>' + fresh.map(id => '<span title="' + esc(TROPHY_INDEX[id].desc) + '">' + TROPHY_INDEX[id].icon + ' ' + esc(TROPHY_INDEX[id].name) + '</span>').join('') + '</div>' : '') +
      '<div class="row"><button class="primary" id="againBtn">Play again</button><button id="trBtn2">&#127942; Trophy Room</button></div></div>';
    $('againBtn').onclick = () => { $('endOv').classList.add('hidden'); showStart(); };
    $('trBtn2').onclick = showTrophies;
  }

  // ---------- trophy room ----------
  const pct = x => +(x * 100).toFixed(1) + '%';
  function refreshTrBtn() { const b = $('trBtn'); if (b) b.innerHTML = '&#127942; Trophy Room (' + trophyCount() + '/' + TROPHIES.length + ')'; }
  const encodeProfile = () => 'OP1:' + btoa(unescape(encodeURIComponent(JSON.stringify(prof))));
  function decodeProfile(s) {
    s = String(s || '').replace(/\s+/g, ''); if (s.indexOf('OP1:') === 0) s = s.slice(4);
    try { return cleanProfile(JSON.parse(decodeURIComponent(escape(atob(s))))); } catch (e) { return null; }
  }
  function showTrophies() {
    const ov = $('trophyOv'); ov.classList.remove('hidden');
    const OUT = { win: 'Won', lose: 'Cured', burnout: 'Burned out' };
    const rate = RATINGS.map((r, i) => {
      const n = prof.ratings[r.id] || 0, lo = i ? RATINGS[i - 1].max : 0;
      const range = i === 0 ? 'under ' + pct(r.max) + ' dead' : i === RATINGS.length - 1 ? pct(lo) + '+ dead' : pct(lo) + ' to ' + pct(r.max) + ' dead';
      return '<div class="rchip' + (n ? ' got' : '') + '"><span class="ri">' + r.icon + '</span><b>' + esc(r.name) + '</b><small>' + range + '</small><small>' + (n ? '&times;' + n + (i === prof.bestRating ? ' · best so far' : '') : 'not yet') + '</small></div>';
    }).join('');
    const cats = TROPHY_CATS.map(c => {
      const list = TROPHIES.filter(t => t.cat === c), have = list.filter(t => prof.trophies[t.id]).length;
      return '<h3>' + c + '<small>' + have + '/' + list.length + '</small></h3><div class="tgrid">' + list.map(t => {
        const g = prof.trophies[t.id];
        return '<div class="tcard' + (g ? ' got' : '') + '" data-id="' + t.id + '"><span class="ticon">' + (g ? t.icon : '&#128274;') + '</span><div><b>' + esc(t.name) + '</b><p>' + esc(t.desc) + '</p>' + (g ? '<small>Unlocked' + (g.t ? ' ' + new Date(g.t).toLocaleDateString() : '') + '</small>' : '') + '</div></div>';
      }).join('') + '</div>';
    }).join('');
    const recent = prof.recent.length ? '<h3>Recent runs</h3><div class="recent">' + prof.recent.map(x => '<div>' + new Date(x.t).toLocaleDateString() + ' · ' + esc(x.name) + ' · ' + esc(RATINGS[x.r].name) + ' · ' + (OUT[x.o] || esc(x.o)) + ' on day ' + x.day + ' · ' + pct(x.dead) + ' dead</div>').join('') + '</div>' : '';
    ov.innerHTML = '<div class="modal tr" role="dialog" aria-modal="true" aria-label="Trophy Room"><header><h2>&#127942; Trophy Room</h2><button id="trClose" aria-label="Close">&times; Close</button></header>' +
      '<div class="stats"><div class="stat"><small>Games played</small><b>' + prof.games + '</b></div><div class="stat"><small>Wins</small><b>' + prof.wins + '</b></div>' +
      '<div class="stat"><small>Fastest win</small><b>' + (prof.fastestWin ? prof.fastestWin + ' days' : 'none yet') + '</b></div>' +
      '<div class="stat"><small>Trophies</small><b>' + trophyCount() + ' / ' + TROPHIES.length + '</b></div></div>' +
      '<h3>Pandemic ratings</h3><div class="rgrid">' + rate + '</div>' + cats + recent +
      '<details><summary>Back up or move your progress</summary><p>Your trophies and records are saved in this browser only. Copy this code somewhere safe, or paste a code from another browser or device and press Load. Loading never removes progress you already have.</p>' +
      '<textarea id="trCode" rows="3" spellcheck="false" aria-label="Backup code"></textarea><div class="row"><button id="trCopy">Copy code</button><button id="trLoad">Load code</button></div><p id="trMsg" role="status"></p></details></div>';
    $('trCode').value = encodeProfile();
    $('trClose').onclick = closeTrophies; $('trClose').focus();
    $('trCopy').onclick = () => {
      const ta = $('trCode'), done = () => { $('trMsg').textContent = 'Copied.'; };
      ta.select();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) {} });
      else { try { document.execCommand('copy'); done(); } catch (e) {} }
    };
    $('trLoad').onclick = () => {
      const p = decodeProfile($('trCode').value);
      if (!p) { $('trMsg').textContent = 'That code could not be read. Paste the whole code, including the OP1: start.'; return; }
      prof = mergeProfile(prof, p); saveProfile(); showTrophies();
      $('trMsg').textContent = 'Loaded. You now have ' + trophyCount() + ' trophies.'; $('trCode').value = encodeProfile();
      const d = ov.querySelector('details'); if (d) d.open = true;
    };
  }
  function closeTrophies() {
    $('trophyOv').classList.add('hidden'); $('trophyOv').innerHTML = '';
    refreshTrBtn(); last = performance.now(); acc = 0;
  }
  $('trophyBtn').addEventListener('click', () => { if (!brkOpen()) showTrophies(); });
  $('menuBtn').addEventListener('click', () => {
    const ov = $('menuOv'); ov.classList.remove('hidden');
    ov.innerHTML = '<div class="modal"><h2>Paused</h2><div class="row"><button class="primary" id="mResume">Resume</button><button id="mNew">New game</button></div>' + settingsHTML() +
      '<p>Keys: Space pause · 1/2/3 speed · E evolve · S sabotage · M mute · scroll or pinch to zoom · drag to pan · click a region for details · click DNA bubbles to collect.</p></div>';
    wireSettings(ov);
    $('mResume').onclick = () => { ov.classList.add('hidden'); last = performance.now(); };
    $('mNew').onclick = () => { ov.classList.add('hidden'); save(); showStart(); };
  });

  // ---------- boot ----------
  if (store.get(CB_KEY) === '1') document.documentElement.dataset.cb = '1';
  updSndBtn();
  MapView.resize(); MapView.fit();
  showStart(); requestAnimationFrame(frame);
  window.__game = { get st() { return st; }, begin, step: () => { if (st) tick(); }, setSpeed, collect: id => { const [x, y] = MapView.bubbleXY(st.bubbles.find(b => b.id === id)); collect(id, x, y); }, closeBreak, openBreak, get blocked() { return blocked(); }, get prof() { return prof; }, showTrophies, closeTrophies, checkLive, encodeProfile, decodeProfile };
})();
